name: lito-action
description: Check package formatting or publish packages with Lito

inputs:
  command:
    description: Operation to run; format-check or publish
    required: true
  token:
    description: Registry publish token stored as a GitHub Actions secret
    required: false
    default: ""
  package:
    description: Single package name to select
    required: false
    default: ""
  packages:
    description: Package names to publish in order, one per line; conflicts with package
    required: false
    default: ""
  publish-interval-seconds:
    description: Seconds to wait between successful package publishes
    required: false
    default: "0"
  lito-version:
    description: Lito release version to use
    required: false
    default: v0.8.6
  working-directory:
    description: Directory containing the Lito project
    required: false
    default: .

runs:
  using: composite
  steps:
    - name: Install Lito
      id: install
      shell: bash
      env:
        LITO_VERSION: ${{ inputs.lito-version }}
      run: "${{ github.action_path }}/scripts/install-lito.sh"

    - name: Run Lito
      shell: bash
      env:
        LITO_ACTION_COMMAND: ${{ inputs.command }}
        LITO_ACTION_PACKAGE: ${{ inputs.package }}
        LITO_ACTION_PACKAGES: ${{ inputs.packages }}
        LITO_ACTION_PUBLISH_INTERVAL_SECONDS: ${{ inputs.publish-interval-seconds }}
        LITO_ACTION_TOKEN: ${{ inputs.token }}
        LITO_ACTION_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        LITO_EXECUTABLE: ${{ steps.install.outputs.executable }}
      run: "${{ github.action_path }}/scripts/run.sh"

branding:
  icon: package
  color: blue
