name: Lito
description: Check package formatting or publish a package with Lito

inputs:
  command:
    description: Operation to run; format-check or publish
    required: true
  token:
    description: Registry publish token stored as a GitHub Actions secret
    required: false
    default: ""
  package:
    description: Package name to select when the workspace has multiple packages
    required: false
    default: ""
  lito-version:
    description: Lito release version to use
    required: false
    default: v0.7.1
  working-directory:
    description: Directory containing the Lito project
    required: false
    default: .

runs:
  using: composite
  steps:
    - name: Install Lito
      id: install
      shell: bash
      env:
        LITO_VERSION: ${{ inputs.lito-version }}
      run: "${{ github.action_path }}/scripts/install-lito.sh"

    - name: Run Lito
      shell: bash
      env:
        LITO_ACTION_COMMAND: ${{ inputs.command }}
        LITO_ACTION_PACKAGE: ${{ inputs.package }}
        LITO_ACTION_TOKEN: ${{ inputs.token }}
        LITO_ACTION_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        LITO_EXECUTABLE: ${{ steps.install.outputs.executable }}
      run: "${{ github.action_path }}/scripts/run.sh"

branding:
  icon: package
  color: blue
